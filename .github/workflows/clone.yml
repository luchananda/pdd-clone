name: Build and deploy the PDD clone
on:
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Refresh the data (NASA, JPL, MPC)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          SKIP_CHARTS: "1"
        run: python3 Marketing/reports/nea/refresh_data.py
      - name: Build the page from the live paper
        run: |
          python3 Marketing/reports/nea/build_clone.py site
          echo "pdd.luisafernanda.space" > site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
