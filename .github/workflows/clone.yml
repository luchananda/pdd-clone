name: Build and deploy the PDD clone
on:
  schedule:
    - cron: "7 */3 * * *"      # every 3 hours (demo on GitHub Pages; pdd.luisafernanda.space is built from luisafernanda-space, see INTEGRATION.md)
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Refresh the data (NASA, JPL, MPC)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          SKIP_CHARTS: "1"
        run: python3 Marketing/reports/nea/refresh_data.py
      - name: Draw the charts (bundled fonts and emoji in Marketing/reports/nea/fonts)
        env:
          CHART_FONTS: bundled
        run: |
          python3 Marketing/reports/nea/nea_charts_v11.py /tmp/charts
          python3 Marketing/reports/nea/pdd_carousels.py /tmp/charts
      - name: Build the page from the live paper
        run: |
          MOCKDIR=/tmp/mockups SITE_OUT=site python3 Marketing/reports/nea/build_mocks.py
          echo "pdd.luisafernanda.space" > site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
